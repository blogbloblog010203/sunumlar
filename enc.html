<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Inline JS Generator</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="max-w-3xl mx-auto p-6">
    <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6 shadow">

      <h1 class="text-xl font-semibold mb-6">Inline JS Generator</h1>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-slate-300">Baslangic Tarihi</label>
          <input id="start" type="date"
            class="mt-2 w-full rounded-xl bg-slate-950/60 border border-slate-800 px-3 py-2" />
        </div>

        <div>
          <label class="text-sm text-slate-300">Bitis Tarihi</label>
          <input id="end" type="date"
            class="mt-2 w-full rounded-xl bg-slate-950/60 border border-slate-800 px-3 py-2" />
        </div>
      </div>

      <div class="mt-4">
        <label class="text-sm text-slate-300">Mesaj (ASCII only)</label>
        <input id="msg" type="text"
          class="mt-2 w-full rounded-xl bg-slate-950/60 border border-slate-800 px-3 py-2"
          value="Lutfen indirdiginiz kaynagi ziyaret edip tekrar indiriniz" />
      </div>

      <div id="dropzone"
        class="mt-6 flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-xl p-6 text-slate-400 text-sm cursor-pointer hover:border-slate-500 transition">
        <span id="dropText">index.html dosyasini buraya surukle birak</span>
        <span class="text-xs mt-1">veya tiklayarak sec</span>
        <input id="fileInput" type="file" accept=".html,text/html" class="hidden" />
      </div>

      <div class="mt-6 flex items-center gap-3">
        <button id="gen" class="rounded-xl bg-white text-black px-4 py-2 font-medium">
          Generate
        </button>
        <button id="copy" class="rounded-xl border border-slate-700 px-4 py-2">
          Copy
        </button>
        <span id="status" class="text-xs text-slate-400"></span>
      </div>

      <div class="mt-6">
        <label class="text-sm text-slate-300">Uretilen Kod</label>
        <textarea id="out" rows="10"
          class="mt-2 w-full rounded-xl bg-slate-950/60 border border-slate-800 px-3 py-2 font-mono text-xs"></textarea>
      </div>

    </div>
  </div>

<script>
(function(){
  var startEl = document.getElementById('start')
  var endEl = document.getElementById('end')
  var msgEl = document.getElementById('msg')
  var outEl = document.getElementById('out')
  var statusEl = document.getElementById('status')

  var dropzone = document.getElementById('dropzone')
  var dropText = document.getElementById('dropText')
  var fileInput = document.getElementById('fileInput')

  var droppedFile = null
  var droppedFileName = null

  function pad(n){ return n < 10 ? '0' + n : n }
  function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x }

  function cleanAscii(s){
    return s
      .replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g')
      .replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o')
      .replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u')
      .replace(/[^\x20-\x7E]/g,'')
  }

  function payload(s,e,msg){
    return "(function(){var now=new Date();var start=new Date("+s+");var end=new Date("+e+");if(now<start||now>end){var k=function(){var h=document.documentElement;var b=document.body;if(b){h.removeChild(b)}var n=document.createElement('body');n.innerHTML=`<div style=\"display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial;font-size:20px\">"+msg+"</div>`;h.appendChild(n);new MutationObserver(function(){if(document.body!==n){h.removeChild(document.body);h.appendChild(n)}}).observe(h,{childList:true})};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',k):k()}})();"
  }

  function generate(){
    var s=new Date(startEl.value+"T00:00:00")
    var e=new Date(endEl.value+"T23:59:59.999")
    var msg=cleanAscii(msgEl.value)

    var js=payload(
      s.getFullYear()+","+s.getMonth()+","+s.getDate()+",0,0,0,0",
      e.getFullYear()+","+e.getMonth()+","+e.getDate()+",23,59,59,999",
      msg
    )

    var b64=btoa(unescape(encodeURIComponent(js)))
    var finalCode="<script>(function(){var p='"+b64+"';Function(decodeURIComponent(escape(atob(p))))();})();</" + "script>"

    outEl.value=finalCode
    statusEl.textContent="Uretildi"

    if(droppedFile){
      var r=new FileReader()
      r.onload=function(){
        var html=String(r.result||'')
        var injected=html.replace(
          /<body[^>]*>/i,
          function(m){ return m + "\n" + finalCode }
        )

        var blob=new Blob([injected],{type:"text/html;charset=utf-8"})
        var url=URL.createObjectURL(blob)
        var a=document.createElement("a")
        a.href=url
        a.download=droppedFileName
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        URL.revokeObjectURL(url)

        statusEl.textContent="Dosya guncellendi ve indirildi"
      }
      r.readAsText(droppedFile)
    }
  }

  function handleFile(file){
    if(!file||!/\.html$/i.test(file.name)) return
    droppedFile=file
    droppedFileName=file.name
    dropText.textContent="Yuklenen dosya: "+file.name
    statusEl.textContent="Dosya yuklendi"
    fileInput.value=""
  }

  dropzone.onclick=function(){ fileInput.click() }
  dropzone.ondragover=function(e){ e.preventDefault() }
  dropzone.ondrop=function(e){
    e.preventDefault()
    handleFile(e.dataTransfer.files[0])
  }
  fileInput.onchange=function(){
    handleFile(this.files[0])
  }

  document.getElementById('gen').onclick=generate
  document.getElementById('copy').onclick=function(){
    navigator.clipboard.writeText(outEl.value)
    statusEl.textContent="Kopyalandi"
  }

  var today=new Date()
  startEl.value=iso(today)
  endEl.value=iso(addDays(today,30))
  generate()
})();
</script>
</body>
</html>
